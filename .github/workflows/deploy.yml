# .github/workflows/deploy.yml
name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Storefront ka src/api.js "VITE_API_BASE" padhta hai (VITE_API_URL nahi).
          VITE_API_BASE: https://api.vakaro.in/api/public

      # Safety: build mein live API URL na gaya ho ya local URL ghus gaya ho to upload hi nahi hoga
      - name: Check live API URL is inside the build
        run: |
          if ! grep -rq "https://api.vakaro.in/api/public" dist/assets; then
            echo "ERROR: live API URL build mein nahi mila. Deploy rok diya."
            exit 1
          fi
          if grep -rqE "127\.0\.0\.1|localhost" dist/assets; then
            echo "ERROR: build mein local URL mila. Deploy rok diya."
            exit 1
          fi
          echo "OK: build mein sirf live API URL hai."

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./